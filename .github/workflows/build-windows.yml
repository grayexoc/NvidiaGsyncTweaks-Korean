name: Windows x64 build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\NvidiaGsyncTweaks.csproj

      - name: Test
        run: dotnet test .\tests\NvidiaGsyncTweaks.Tests\NvidiaGsyncTweaks.Tests.csproj -c Release --no-restore

      - name: Publish win-x64
        run: dotnet publish .\NvidiaGsyncTweaks.csproj -c Release -r win-x64 --no-restore -o .\publish /p:Version=1.0.${{ github.run_number }}

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path .\publish\* -DestinationPath .\NvidiaGsyncTweaks-win-x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NvidiaGsyncTweaks-win-x64
          path: .\NvidiaGsyncTweaks-win-x64.zip
          if-no-files-found: error
          retention-days: 30
