name: Windows x64 build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show SDK
        run: dotnet --info

      - name: Unit tests
        run: dotnet test tests/NvidiaGsyncTweaks.Tests/NvidiaGsyncTweaks.Tests.csproj -c Release --nologo

      - name: Make vswhere visible
        run: '"C:\Program Files (x86)\Microsoft Visual Studio\Installer" >> $env:GITHUB_PATH'

      - name: Publish NativeAOT (win-x64)
        run: >
          dotnet publish NvidiaGsyncTweaks.csproj
          -c Release -r win-x64 -p:Platform=x64
          -p:Version=1.0.${{ github.run_number }}
          -p:SourceRevisionId=${{ github.sha }}
          --nologo -o publish

      - name: Verify published app
        shell: pwsh
        run: |
          $exe = Get-Item publish/NvidiaGsyncTweaks.exe
          if ($exe.Length -lt 1MB) { throw "NvidiaGsyncTweaks.exe looks wrong ($($exe.Length) bytes)" }
          Get-ChildItem publish -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Package
        shell: pwsh
        run: |
          Remove-Item publish/*.pdb -Force -ErrorAction SilentlyContinue
          Copy-Item README.md, docs/DRIVER-ANALYSIS-ko.md publish/ -Force
          Compress-Archive -Path publish/* -DestinationPath NvidiaGsyncTweaks-Korean-win-x64.zip -Force
          (Get-FileHash NvidiaGsyncTweaks-Korean-win-x64.zip -Algorithm SHA256).Hash.ToLower() + "  NvidiaGsyncTweaks-Korean-win-x64.zip" | Set-Content NvidiaGsyncTweaks-Korean-win-x64.zip.sha256 -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NvidiaGsyncTweaks-Korean-win-x64
          path: |
            NvidiaGsyncTweaks-Korean-win-x64.zip
            NvidiaGsyncTweaks-Korean-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
